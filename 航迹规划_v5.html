<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>航迹规划</title>
<style>
/* ===== 浅底战术台 Flat Ops Console：逐项对齐 index.html 的色值与组件参数 ===== */
:root{
  --bg:#F5F7FA; --panel:#FFFFFF; --line:#D7DEE8;
  --ink:#1B2733; --muted:#5A6B7C;
  --accent:#185FA5; --accent-soft:#E6F1FB;
  --danger:#A32D2D; --danger-fill:rgba(163,45,45,.12);
  --warn:#BA7517; --warn-soft:#FAEEDA;
  --wind:#9FB6CC;
  --good:#0F6E56;
  --shadow:0 1px 3px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px;line-height:1.5;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* ===== 顶条 ===== */
header{flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:170px;}
.brand b{font-size:15px;letter-spacing:.2px}
.hgroup{display:flex;align-items:center;gap:6px}
.hgroup .lab,.battery .lab{font-size:11px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 11px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:78px;color:var(--accent)}
.timer.danger{color:var(--danger)}
.battery{display:flex;align-items:center;gap:7px;min-width:132px}
.battery .track{width:76px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.battery .track i{display:block;height:100%;background:var(--good);transition:width .18s linear}
.battery .num{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:34px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#134E89}
.btn.warn{background:var(--warn-soft);border-color:#E4C48C;color:#7A4D0C}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:6px}
.btn.danger{color:var(--danger);border-color:#E5C4C4}
.btn.danger:hover{background:#FBEEEE;border-color:var(--danger)}

/* ===== 主体：左 2/3 展示区 + 右 1/3 控件栏 ===== */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:10px;padding:10px}
.left{min-height:0;display:flex;flex-direction:column;gap:8px}
.right{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.card>.hd .tag{font-size:10px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.card>.hd .sp{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
#viewCard{flex:1 1 66%;min-height:0;display:flex;flex-direction:column}
#profileCard{flex:1 1 34%;min-height:0;display:flex;flex-direction:column}
.canvasWrap{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0 0 10px 10px}
canvas{display:block;width:100%;height:100%;touch-action:none}
#sceneCv{cursor:grab}
#sceneCv.dragging{cursor:grabbing}
.overlayTip{position:absolute;left:10px;top:9px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;font-size:11px;color:var(--muted);pointer-events:none;max-width:78%}
.overlayTip b{color:var(--ink)}
.badgeLive{position:absolute;right:10px;top:9px;font-size:10px;font-weight:700;letter-spacing:.4px;
  background:var(--accent);color:#fff;border-radius:5px;padding:3px 8px;pointer-events:none}
.badgeLive.paused{background:var(--warn)}
.badgeLive.fail{background:var(--danger)} .badgeLive.ok{background:var(--good)}
.playbar{flex:none;display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.playbar input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.playbar .t{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:82px;text-align:right}
.sec{padding:7px 10px}
.sec+.sec{border-top:1px solid var(--line)}
.sec h3{margin:0 0 7px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;display:flex;gap:6px;align-items:center}
.sec h3 em{font-style:normal;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;font-size:10px}
.wsum{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.wsum.bad{color:var(--danger);font-weight:700}
.sliderRow{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:7px;margin:5px 0}
.sliderRow label{font-size:11px}
.sliderRow input[type=range]{width:100%;accent-color:var(--accent)}
.sliderRow .v{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;text-align:right;color:var(--accent)}
.btnGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.btnGrid.two{grid-template-columns:repeat(2,1fr)}
.btnGrid .opt small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.btnGrid .opt.locked{background:var(--warn-soft);border-color:#E4C48C;color:#7A4D0C}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-size:11px}
.switchRow label{cursor:pointer}
.switchRow input{accent-color:var(--accent);width:15px;height:15px}
.btnGrid .opt{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 4px;font-size:11px;text-align:center}
.btnGrid .opt:hover{border-color:var(--accent)}
.btnGrid .opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl{display:flex;align-items:center;gap:6px;font-size:11px}
.lbl input{accent-color:var(--accent);width:15px;height:15px}
#algoReadout{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:6px}
.slots .slot{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 4px;text-align:center;background:var(--bg)}
.slots .slot .n{font-size:10px;color:var(--muted);margin-bottom:4px}
.slots .slot .n b{color:var(--good)}
.slots .slot button{width:100%;margin-top:3px}
table.metrics{width:100%;border-collapse:collapse;font-size:11px}
table.metrics th,table.metrics td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
table.metrics th{color:var(--muted);font-weight:600;font-size:10px}
table.metrics th:first-child,table.metrics td:first-child{text-align:left}
table.metrics td.est{color:var(--muted)} table.metrics td.real{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
table.metrics tr:last-child td{border-bottom:0}
.modeTag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.modeTag.real{background:var(--accent-soft);border-color:#BBD7F2;color:var(--accent)}
.radarBox{display:grid;grid-template-columns:1fr 108px;gap:8px;align-items:center}
.readouts{font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.readouts .dbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.readouts .dbar i{display:block;height:100%;background:var(--accent)}
#radarWrap{height:140px}

/* ===== 模态框 ===== */
#mask{position:fixed;inset:0;background:rgba(27,39,51,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50}
#mask.hidden{display:none}
#modal{position:relative;width:400px;max-width:92vw;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 22px 64px rgba(27,39,51,.30);overflow:hidden;
  animation:modalPop .34s cubic-bezier(.2,.9,.3,1.2)}
#modal.wide{width:min(560px,94vw)}
@keyframes modalPop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
body.resultView #modal,body.resultView .gradeBadge{animation:none}
body.resultView #fxLayer i{animation-delay:-.5s !important;opacity:1 !important}
#modalTitle{padding:11px 16px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);background:var(--bg)}
#modalBody{padding:14px 18px;font-size:12px;line-height:1.65;max-height:70vh;overflow-y:auto}
#modal:not(.result) #modalBody h4{margin:12px 0 5px;font-size:12px;color:var(--accent)}
#modal:not(.result) #modalBody h4:first-child{margin-top:0}
#modal:not(.result) #modalBody ul{margin:4px 0;padding-left:18px}
#modal:not(.result) #modalBody li{margin:3px 0}
#modal:not(.result) #modalBody code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
table.theory{width:100%;border-collapse:collapse;font-size:11px;margin-top:5px}
table.theory th,table.theory td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.theory th{background:var(--bg);color:var(--accent);font-weight:700}
#modalFoot{padding:10px 16px;border-top:1px solid var(--line);text-align:right;background:var(--bg)}
#fxLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
#fxLayer i{position:absolute;width:7px;height:13px;border-radius:2px;opacity:0;animation:confetti linear forwards}
@keyframes confetti{0%{opacity:1;transform:translateY(-14px) rotate(0)}100%{opacity:0;transform:translateY(460px) rotate(720deg)}}
#fxLayer.pulse{background:radial-gradient(circle at 50% 18%,rgba(163,45,45,.32),transparent 62%);animation:pulse .7s ease-out 2}
@keyframes pulse{0%{opacity:0}40%{opacity:1}100%{opacity:0}}

/* ===== 结算弹窗：A/B/C/D 等级 + 分项条 ===== */
#modal.result{width:420px}
#modal.result #modalBody{padding:0;max-height:none}
#modal.result #modalTitle{display:none}
.rhead{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;color:var(--ink);
  background:var(--bg);border-bottom:2px solid var(--line)}
#modal.result .rhead{border-bottom-color:var(--good)}
#modal.result.fail .rhead{border-bottom-color:var(--danger)}
.rhead:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% -20%,rgba(27,39,51,.05),transparent 58%)}
.gradeBadge{position:relative;z-index:1;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
  font-size:36px;font-weight:800;line-height:1;background:var(--panel);border:2px solid var(--line);color:var(--ink);
  box-shadow:var(--shadow);animation:badgePop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes badgePop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.gradeBadge.A{background:var(--good);border-color:var(--good);color:#fff}
.gradeBadge.B{background:var(--accent);border-color:var(--accent);color:#fff}
.gradeBadge.C{background:var(--warn);border-color:var(--warn);color:#fff}
.gradeBadge.D{background:var(--danger);border-color:var(--danger);color:#fff}
.rtxt{position:relative;z-index:1;flex:1;min-width:0}
.rtxt h2{margin:0 0 2px;font-size:18px;letter-spacing:.5px}
.rtxt .rsub{font-size:11px;opacity:.9;margin-bottom:8px}
.rbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .8s ease-out}
.rscore{font-size:11px;margin-top:6px;opacity:.95}
.rscore b{font-size:16px;font-variant-numeric:tabular-nums}
.rbody{padding:14px 20px 16px}
.rsec{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin:0 0 7px}
.rsec+.rsec{margin-top:14px}
.frow{display:grid;grid-template-columns:40px 1fr 34px;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.frow .dbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.frow .dbar i{display:block;height:100%;background:linear-gradient(90deg,#8FA2B5,#B6C4D2);border-radius:4px}
.frow .fv{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.gradeScale{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 13px}
.gradeScale span{text-align:center;padding:4px 0;border:1px solid var(--line);border-radius:6px;font-weight:700;font-size:11px;color:var(--muted)}
.gradeScale span.on{color:var(--ink)}
.gradeScale span.on.gA{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 2px 8px rgba(15,110,86,.30)}
.gradeScale span.on.gB{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(24,95,165,.30)}
.gradeScale span.on.gC{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 2px 8px rgba(186,117,23,.30)}
.gradeScale span.on.gD{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(163,45,45,.30)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:11px}
.kv span{color:var(--muted)} .kv b{font-variant-numeric:tabular-nums}
.ok{color:var(--good)} .bad{color:var(--danger)}

#selftestOut{position:fixed;top:0;left:0;right:0;max-height:56vh;overflow:auto;z-index:90;margin:0;padding:8px 12px;
  background:#fff;border-bottom:2px solid var(--accent);font:12px/1.45 Consolas,monospace;white-space:pre-wrap}
#selftestOut.hidden{display:none}
@media(max-width:900px){body{height:auto;min-height:100dvh;overflow:auto}main{grid-template-columns:1fr;overflow:visible}.right{overflow:visible}#viewCard{flex:none;height:44dvh}#profileCard{flex:none;height:26dvh}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>航迹规划</b></div>
    <div class="hgroup"><span class="lab">难度</span>
      <div class="seg" id="diffSeg"><button data-d="low">低</button><button data-d="mid">中</button><button data-d="high">高</button></div>
    </div>
    <div class="hgroup" id="sceneGroup"><span class="lab">场景</span>
      <div class="seg" id="sceneSeg"><button data-s="city">城市</button><button data-s="factory">工厂</button><button data-s="bridge">跨江大桥</button></div>
    </div>
    <div class="hgroup"><span class="lab">计时</span><span class="timer" id="hudTime">0.0</span></div>
    <div class="battery"><span class="lab">电量</span><span class="track"><i id="battFill" style="width:100%"></i></span><span class="num" id="hudBat">100%</span></div>
    <div class="spacer"></div>
    <button class="btn" id="theoryBtn">原理</button>
  </header>

  <main>
    <section class="left">
      <div class="card" id="viewCard">
        <div class="hd"><span>飞行结果展示区</span><span class="tag" id="viewTag">2D 俯视</span></div>
        <div class="canvasWrap">
          <canvas id="sceneCv"></canvas>
          <div class="overlayTip" id="viewHint"></div>
          <div class="badgeLive" id="liveBadge">待飞行</div>
        </div>
      </div>
      <div class="card" id="profileCard">
        <div class="hd"><span>高度剖面</span></div>
        <div class="canvasWrap"><canvas id="profileCv"></canvas></div>
      </div>
      <div class="playbar">
        <button class="btn primary" id="flyBtn">开始飞行</button>
        <button class="btn" id="pauseBtn">暂停</button>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <span class="t" id="playTime">0.0 / 0.0 s</span>
      </div>
    </section>

    <aside class="right">
      <div class="card">
        <div class="hd"><span>代价权重</span></div>
        <div class="sec">
          <div class="sliderRow"><label for="wT">时效</label><input type="range" id="wT" min="0" max="100" value="60"><span class="v" id="vT">60</span></div>
          <div class="sliderRow"><label for="wE">能耗</label><input type="range" id="wE" min="0" max="100" value="30"><span class="v" id="vE">30</span></div>
          <div class="sliderRow"><label for="wS">安全</label><input type="range" id="wS" min="0" max="100" value="40"><span class="v" id="vS">40</span></div>
        </div>
        <div class="sec"><button class="btn" id="hintBtn" style="width:100%">权重提示</button></div>
      </div>

      <div class="card">
        <div class="hd"><span>路径规划算法</span></div>
        <div class="sec"><div class="btnGrid">
          <button class="opt" data-a="astar">A*</button><button class="opt" data-a="rrt">RRT*</button><button class="opt" data-a="dijkstra">Dijkstra</button>
        </div></div>
        <div class="sec"><label class="lbl"><input type="checkbox" id="compareChk"> 同时对比</label></div>
        <div class="sec" id="algoReadout">—</div>
      </div>

      <div class="card">
        <div class="hd"><span>对照样本</span></div>
        <div class="sec"><div class="btnGrid" id="sampleGrid">
          <button class="opt" data-s="A">A 直线</button><button class="opt" data-s="B">B 近边</button><button class="opt" data-s="C">C 平滑</button>
        </div></div>
      </div>

      <div class="card">
        <div class="hd"><span>方案槽</span></div>
        <div class="sec"><div class="slots" id="slotGrid"></div></div>
      </div>

      <div class="card">
        <div class="hd"><span>辅助读数</span></div>
        <div class="sec"><table class="metrics"><thead><tr><th>指标</th><th>预计</th><th>实测</th></tr></thead><tbody id="metricBody"></tbody></table></div>
        <div class="sec" id="radarWrap"><canvas id="radarCv"></canvas></div>
      </div>
    </aside>
  </main>
</div>

<div id="mask" class="hidden">
  <div id="modal">
    <div id="fxLayer"></div>
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalFoot"><button class="btn primary" id="modalClose">关闭</button></div>
  </div>
</div>
<pre id="selftestOut" class="hidden"></pre>

<script>
/* =========================================================================
   航迹规划 · 单文件教学原型 v2（沿用上一版浅底战术台风格）
   0 工具 / 1 配置 / 2 状态 / 3 场景 / 4 路径 / 5 仿真评分
   6 三维渲染 / 7 UI / 8 交互 / 9 回放结算 / 10 自测 / 11 初始化
   零外部依赖：3D = 自研透视投影 + 深度排序光栅化（Canvas 2D）
   ========================================================================= */

/* ---------- 0. 工具 ---------- */
const $ = id => document.getElementById(id);
const $$ = sel => Array.prototype.slice.call(document.querySelectorAll(sel));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp  = (a,b,t) => a+(b-a)*t;
const dist3 = (a,b) => Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0));
const dot   = (a,b) => a.x*b.x+a.y*b.y+a.z*b.z;
const sub   = (a,b) => ({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const cross = (a,b) => ({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const norm  = v => {const l=Math.hypot(v.x,v.y,v.z)||1;return {x:v.x/l,y:v.y/l,z:v.z/l};};
const lerp3 = (a,b,t) => ({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:lerp(a.z,b.z,t)});
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function shade(col,f){
  let r=128,g=128,b=128;
  if(col.charAt(0)==='#'){const n=parseInt(col.slice(1),16);r=(n>>16)&255;g=(n>>8)&255;b=n&255;}
  else{const m=col.match(/(\d+),\s*(\d+),\s*(\d+)/);if(m){r=+m[1];g=+m[2];b=+m[3];}}
  return 'rgb('+clamp(Math.round(r*f),0,255)+','+clamp(Math.round(g*f),0,255)+','+clamp(Math.round(b*f),0,255)+')';
}
function distSeg3(p,a,b){const ab=sub(b,a),ap=sub(p,a),l2=dot(ab,ab)||1e-6,t=clamp(dot(ap,ab)/l2,0,1);return dist3(p,{x:a.x+ab.x*t,y:a.y+ab.y*t,z:a.z+ab.z*t});}
const fmt=(v,n)=>(+v).toFixed(n===undefined?1:n);

/* ---------- 3. 场景生成 ----------
   保留三条可通行走廊：南侧 y<14、东侧 x>88、北侧 y>48；
   障碍集中在中部带，让斜对角直线必撞中心信号塔。
   高难增加楼顶设备、窗带、储罐、管廊、斜拉索、护栏等真实感细节。 */
/* ---------- 3. 场景生成 ----------
   真实感建模：城市=道路网格切街区块+退线+楼间距；工厂=厂区路网+大跨度坡顶厂房；
   桥梁=南北向江面+承台/桥墩+分节箱梁+门式桥塔(桥面外侧)+双索面斜拉索。
   细长构件一律 <=9m 分段，配合统一深度队列，杜绝长条面排序错乱造成的穿模。
   永久保留三条走廊：y<14 / x>88 / y>48。 */
function buildScene(kind,diff){
  const D=DIFFS[diff],R=rng(101+({city:1,factory:2,bridge:3}[kind])*977+({low:1,mid:2,high:3}[diff])*131);
  const g={blocks:[],cyls:[],roofs:[],wedges:[],lines:[],dots:[],roads:[],cables:[],solids:[],
           water:null,bridge:null,noFly:[],ceiling:CFG.ceiling,minSafe:D.minSafe,
           kind:kind,diff:diff,detail:D.detail,
           stats:{buildings:0,decks:0,piers:0,pylons:0,cables:0,wedges:0},cityOverlaps:0};
  const addBlock=(x,y,w,dd,h,color,tag,z0)=>{
    const z=z0===undefined?0:z0,b={x0:x,x1:x+w,y0:y,y1:y+dd,z0:z,z1:z+h,color:color,tag:tag||'b'};
    g.blocks.push(b);g.solids.push({x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,z0:b.z0,z1:b.z1});
    return b;
  };
  const addCyl=(x,y,r,h,color,tag,z0,dome,ring,rTop)=>{
    const z=z0===undefined?0:z0;
    g.cyls.push({x:x,y:y,r:r,rTop:rTop||r,z0:z,z1:z+h,color:color,tag:tag||'c',dome:dome||0,ring:ring||0});
    g.solids.push({x0:x-r,x1:x+r,y0:y-r,y1:y+r,z0:z,z1:z+h+(dome||0)});
  };
  const addWedge=(b,rise,color)=>{
    g.wedges.push({x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,z0:b.z1,z1:b.z1+rise,color:color||shade(b.color,.88)});
    g.stats.wedges++;
  };
  const deco=(a,b,color,lw,dash,tag)=>g.lines.push({a:a,b:b,color:color||'rgba(255,255,255,.5)',
    lw:lw||1,dash:dash||[],tag:tag||''});
  const segBox=(x,y,w,d,h,color,tag,z0)=>{
    const n=Math.max(1,Math.ceil(Math.max(w,d)/9)),out=[];
    for(let i=0;i<n;i++){
      if(w>=d)out.push(addBlock(x+w*i/n,y,w/n,d,h,color,tag,z0));
      else out.push(addBlock(x,y+d*i/n,w,d/n,h,color,tag,z0));
    }
    return out;
  };
  /* 空域保留区：禁飞区 + 中心塔净空 */
  if(diff!=='low')g.noFly.push({x0:32,x1:42,y0:24,y1:34,z0:0,z1:26});
  if(diff==='high')g.noFly.push({x0:60,x1:70,y0:38,y1:46,z0:0,z1:24});
  const reserve=[{x0:CFG.tower.x-8,x1:CFG.tower.x+8,y0:CFG.tower.y-8,y1:CFG.tower.y+8}].concat(g.noFly);
  const blocked=b=>reserve.some(r=>b.x0<r.x1&&b.x1>r.x0&&b.y0<r.y1&&b.y1>r.y0);

  /* 中心信号塔：桥梁场景由桥塔取代，避免塔柱从水底直插穿桥面 */
  if(kind!=='bridge'){
    addCyl(CFG.tower.x,CFG.tower.y,CFG.tower.r,CFG.tower.h,CFG.colors.tower,'tower',0,0,3.5,CFG.tower.r*.42);
    deco({x:CFG.tower.x,y:CFG.tower.y,z:CFG.tower.h},{x:CFG.tower.x,y:CFG.tower.y,z:CFG.tower.h+2.6},'#8E2727',1.4);
    g.dots.push({x:CFG.tower.x,y:CFG.tower.y,z:CFG.tower.h+2.8,r:1.1});
  }

  if(kind==='city'){
    /* 路网：主干十字(宽6)+次干(宽3/2)，切出 4x2 个街区块；建筑一律退线 2m 以上 */
    [[47,53,0,60],[0,100,27,33],[28.5,31.5,0,60],[68.5,71.5,0,60],[0,100,15,17],[0,100,42,44]]
      .forEach(r=>g.roads.push({x0:r[0],x1:r[1],y0:r[2],y1:r[3],color:CFG.colors.road}));
    if(D.detail>=1){
      for(let x=3;x<97;x+=9)deco({x:x,y:30,z:.05},{x:x+3,y:30,z:.05},'rgba(255,255,255,.85)',1.2);
      for(let y=3;y<58;y+=9)deco({x:50,y:y,z:.05},{x:50,y:y+3,z:.05},'rgba(255,255,255,.85)',1.2);
    }
    const XS=[[10,28.5],[31.5,47],[53,68.5],[71.5,86]],YS=[[17,27],[33,42]];
    const per=diff==='high'?2:1,placed=[];
    for(let j=0;j<YS.length;j++)for(let i=0;i<XS.length;i++){
      const xa=XS[i][0],xb=XS[i][1],ya=YS[j][0],yb=YS[j][1];
      for(let k=0;k<per;k++){
        const slotW=(xb-xa-4)/per,sx=xa+2+k*slotW,roll=R();
        const tall=diff==='high'&&(i===1||i===2)&&roll>.3;                 /* 塔楼 / 板楼 / 裙房 */
        const w=clamp(slotW-2.5-R()*1.2,3.4,9.5),d=clamp((yb-ya)-4.6-R()*1.2,3.2,7.2);
        const h=(tall?19+R()*11:(roll>.6?11+R()*5:6+R()*4))*D.hMul;
        const bx=sx+(slotW-w)/2,by=ya+2+((yb-ya)-4-d)/2;
        const box={x0:bx,x1:bx+w,y0:by,y1:by+d};
        if(blocked(box))continue;
        if(placed.some(p=>box.x0<p.x1+2&&box.x1+2>p.x0&&box.y0<p.y1+2&&box.y1+2>p.y0)){g.cityOverlaps++;continue;}
        placed.push(box);
        const col=tall?CFG.colors.cityA:(roll>.6?CFG.colors.cityB:CFG.colors.cityC);
        let b;
        if(tall){
          const ph=h*.24;
          addBlock(bx-.8,by-.8,w+1.6,d+1.6,ph,shade(col,.90),'podium',0);
          b=addBlock(bx,by,w,d,h-ph,col,'towerB',ph);
        }else b=addBlock(bx,by,w,d,h,col,'slab');
        g.stats.buildings++;
        if(D.detail>=1){
          const segs=Math.max(1,Math.ceil(w/5));
          for(let zz=b.z0+2;zz<b.z1-1.4;zz+=3.4)for(let s=0;s<segs;s++)
            deco({x:b.x0+w*s/segs+.22,y:b.y0-.06,z:zz},{x:b.x0+w*(s+1)/segs-.22,y:b.y0-.06,z:zz},
                 'rgba(255,255,255,.62)',1);
          for(let s=1;s<segs;s++){
            const vx=b.x0+w*s/segs;
            deco({x:vx,y:b.y0-.07,z:b.z0+1},{x:vx,y:b.y0-.07,z:b.z1-.8},'rgba(255,255,255,.30)',.7);
          }
          if(tall&&R()>.4)g.roofs.push({x0:bx+w*.28,x1:bx+w*.60,y0:by+d*.28,y1:by+d*.60,
            z0:h,z1:h+1+R(),color:shade(col,.8),tag:'roof'});
          if(!tall&&h<12&&R()>.4)addWedge(b,1.5,shade(col,.86));
        }
      }
    }
  }else if(kind==='factory'){
    [[47,53,0,60],[0,100,27,33],[0,100,44,46]].forEach(r=>g.roads.push({x0:r[0],x1:r[1],y0:r[2],y1:r[3],color:CFG.colors.road}));
    /* 大跨度单层厂房：按厂区地块排布，配双坡屋顶（真实厂房不是纯方块） */
    const plots=[[10,18,16,8],[32,18,13,8],[57,18,13,8],[74,18,12,8],
                 [10,35,16,8],[32,35,13,8],[57,35,13,8],[74,35,11,8]];
    const use=diff==='high'?8:(diff==='mid'?6:4);
    for(let i=0;i<use;i++){
      const p=plots[i];
      if(blocked({x0:p[0],x1:p[0]+p[2],y0:p[1],y1:p[1]+p[3]}))continue;
      const h=(6+R()*2.2)*D.hMul;
      const b=addBlock(p[0],p[1],p[2],p[3],h,CFG.colors.factory,'hall');
      addWedge(b,2.2+R()*.8,shade(b.color,.9));
      if(D.detail>=1)for(let k=1;k<4;k++)
        deco({x:b.x0+1,y:b.y0+k*2,z:b.z1+.05},{x:b.x1-1,y:b.y0+k*2,z:b.z1+.05},'rgba(255,255,255,.55)',1);
    }
    /* 烟囱：筒身 + 顶部收口 + 红白航标环 */
    const nc=diff==='high'?3:2;
    for(let i=0;i<nc;i++){
      const x=[24,76,50][i],y=[46,46,45][i],h=(17+R()*8)*D.hMul,r=1.3+R()*.5;
      addCyl(x,y,r,h,CFG.colors.chimney,'chimney',0,0,3);
      if(D.detail>=1)for(let k=0;k<3;k++)g.dots.push({x:x+(k-1)*1.2,y:y,z:h+2.5+k*2.2,r:1.5+k*.6});
    }
    /* 储罐：圆柱 + 穹顶 */
    [[32,22,4],[68,39,3.6],[84,20,3.2]].forEach((v,i)=>{
      if(i===2&&diff!=='high')return;
      addCyl(v[0],v[1],v[2],6.5,CFG.colors.tank,'tank',0,1.3,0);
    });
    /* 架空管廊：按跨分段 + 支架，不再是一整条穿模长盒 */
    if(D.detail>=1)for(let x=12;x<80;x+=8){
      addBlock(x,38,8,.55,.55,CFG.colors.chimney,'pipe',6.2);
      addBlock(x+.3,38.1,.35,.35,6.2,CFG.colors.chimney,'pipepost',0);
    }
  }else{
    /* 跨江大桥：江为南北向带 x∈[40,60]，桥沿 x 方向真正跨江，桥轴线 y=30 */
    g.water={x0:40,x1:60,y0:0,y1:60,z:0};
    const Y0=27,Y1=33,ZB=17.5,ZT=20;
    g.bridge={x0:6,x1:94,y0:Y0,y1:Y1,zDeck:ZB,zDeckTop:ZT};
    /* 桥梁场景重定位禁飞区，避开桥体与桥塔 */
    g.noFly.length=0;
    if(diff!=='low')g.noFly.push({x0:16,x1:25,y0:36,y1:44,z0:0,z1:26});
    if(diff==='high')g.noFly.push({x0:72,x1:81,y0:16,y1:24,z0:0,z1:24});
    g.roads.push({x0:0,x1:40,y0:28.5,y1:31.5,color:CFG.colors.road});
    g.roads.push({x0:60,x1:100,y0:28.5,y1:31.5,color:CFG.colors.road});
    /* 江岸护岸：分节矮墙，明确南北向江界 */
    for(let y=0;y<60;y+=8){
      const dd=Math.min(8,60-y);
      addBlock(39.3,y,.7,dd,.9,'#B7C2CD','bank',0);
      addBlock(60,y,.7,dd,.9,'#B7C2CD','bank',0);
    }
    /* 1) 分节箱梁：每 8m 一节，顶板 + 箱梁底板，接缝即真实节段缝 */
    for(let x=6;x<94;x+=8){
      const w=Math.min(8,94-x);
      addBlock(x,Y0,w,6,2.5,CFG.colors.bridge,'deck',ZB);
      addBlock(x,Y0+.8,w,4.4,.9,'#7E91A5','girder',ZB-.9);
      g.stats.decks++;
    }
    /* 2) 桥墩：只落在两岸陆地，江心主跨不落墩 */
    const piers=diff==='high'?[12,22,32,68,78,88]:[16,30,70,84];
    piers.forEach(px=>{
      addBlock(px-2.4,Y0-.5,4.8,7,1.4,'#7E91A5','base',0);
      addBlock(px-1.3,Y0+1.3,2.6,3.4,16.1,CFG.colors.bridge,'pier',1.4);
      addBlock(px-2.2,Y0,4.4,6,.9,CFG.colors.bridge,'cap',16.6);
      g.stats.piers++;
    });
    /* 3) 门式桥塔：两根矩形塔柱严格位于桥面外侧(y<27 / y>33)，绝不插穿桥面 */
    [40,60].forEach(tx=>{
      addBlock(tx-3,24.6,6,10.8,1.6,'#7E91A5','pilecap',0);
      addBlock(tx-1.2,24.6,2.4,2.4,28.4,CFG.colors.bridge,'pylon',1.6);
      addBlock(tx-1.2,33.0,2.4,2.4,28.4,CFG.colors.bridge,'pylon',1.6);
      segBox(tx-1.2,24.6,2.4,10.8,1.8,CFG.colors.bridge,'beam',25.5);   /* 上横梁跨桥面上空 */
      g.stats.pylons+=2;
    });
    /* 4) 双索面斜拉索：锚点在桥面两侧边缘上方，全程 z>=ZT，不插进桥面 */
    [40,60].forEach(tx=>{
      [25.8,34.2].forEach((ty,i)=>{
        const ay=i===0?Y0+.2:Y1-.2;
        [-1,1].forEach(dir=>[4,9,14].forEach(off=>{
          const ex=tx+dir*off*(tx===40?(dir===1?1:.85):(dir===-1?1:.85));
          if(ex<7||ex>93)return;
          const a={x:tx,y:ty,z:29.4},b={x:ex,y:ay,z:ZT+.3};
          g.cables.push({a:a,b:b});deco(a,b,'#5E7085',1.35,null,'cable');
          g.stats.cables++;
        }));
      });
    });
    /* 5) 护栏 / 车道虚线 / 路灯：全部按段生成并进入深度队列 */
    if(D.detail>=1){
      for(let x=6;x<94;x+=8){
        const w=Math.min(8,94-x);
        addBlock(x,Y0-.35,w,.35,1.2,CFG.colors.bridge,'rail',ZT);
        addBlock(x,Y1,w,.35,1.2,CFG.colors.bridge,'rail',ZT);
        for(let s=0;s<2;s++){
          const x0=x+s*4;
          deco({x:x0,y:30,z:ZT+.06},{x:x0+2.2,y:30,z:ZT+.06},'rgba(255,255,255,.85)',1.1);
        }
      }
      for(let x=14;x<90;x+=12){
        deco({x:x,y:Y0-.2,z:ZT},{x:x,y:Y0-.2,z:ZT+3.2},'#6B7B8C',1);
        g.dots.push({x:x,y:Y0-.2,z:ZT+3.3,r:1.1});
      }
    }
    /* 6) 岸边建筑：只在陆地，不压三条走廊；配双坡屋顶 */
    [[10,18,10,6,8],[24,36,9,6,7],[66,18,10,6,9],[76,36,8,6,7]].forEach((v,i)=>{
      if(i>=3&&diff!=='high')return;
      const b=addBlock(v[0],v[1],v[2],v[3],v[4]*D.hMul,CFG.colors.cityB,'shore');
      if(D.detail>=1)addWedge(b,1.3,shade(b.color,.88));
    });
  }
  for(const n of g.noFly)g.solids.push({x0:n.x0,x1:n.x1,y0:n.y0,y1:n.y1,z0:n.z0,z1:n.z1});
  return g;
}

/* ---------- 4. 路径 ---------- */
function basePoint(k){return lerp3(CFG.start,CFG.end,k);}
const LANE=(function(){const dx=CFG.end.x-CFG.start.x,dy=CFG.end.y-CFG.start.y,l=Math.hypot(dx,dy);return {x:-dy/l,y:dx/l};})();
function lanePoint(k,side,z){const b=basePoint(k);return {x:clamp(b.x+LANE.x*side,2,98),y:clamp(b.y+LANE.y*side,2,58),z:z===undefined?b.z:z};}
function defaultPath(){return [0,.25,.5,.75,1].map(k=>basePoint(k));}
function samplePath(kind){
  if(kind==='A')return [basePoint(0),basePoint(.5),basePoint(1)];
  const amp=kind==='B'?20:36,n=kind==='B'?5:9,out=[];
  for(let i=0;i<=n;i++){
    const k=i/n;out.push(lanePoint(k,amp*Math.sin(Math.PI*k),basePoint(k).z+(kind==='C'?3*Math.sin(Math.PI*k):0)));
  }
  out[0]={...CFG.start};out[n]={...CFG.end};return out;
}
/* 三种算法 × 三难度 × 三场景：绕行幅度、航点数、高度分层、场景特化都不同 */
function algoPath(kind,w,diff,scene){
  const D=DIFFS[diff];
  const n=(kind==='rrt'?14:kind==='dijkstra'?10:8)+D.ptsAdd;
  let amp=clamp(14+0.15*w.S-0.075*w.T+D.ampAdd,8,48);
  let zAmp=D.zAmp*(0.45+0.55*w.E/100);
  const dir=kind==='astar'?-1:(kind==='dijkstra'?1:0.35);
  if(scene==='bridge'){amp+=5;zAmp+=D.detail?4:1;}
  if(scene==='factory')amp+=3;
  const out=[];
  for(let i=0;i<=n;i++){
    const k=i/n;
    let side=amp*Math.sin(Math.PI*k);
    if(kind==='astar')side=amp*Math.round(Math.sin(Math.PI*k)*3)/3;                    /* 栅格折线 */
    else if(kind==='dijkstra')side=(amp+7)*Math.sin(Math.PI*k)+3*Math.sin(k*Math.PI*4); /* 保守远绕 */
    else side=side+2.2*Math.sin(k*Math.PI*6+1.3);                                       /* 平滑扰动 */
    if(diff==='high'&&scene==='city')side+=4*Math.sin(k*Math.PI*8);                      /* 高难穿街巷 */
    if(diff==='high'&&scene==='bridge')side+=6*Math.sin(k*Math.PI*2);
    let z=basePoint(k).z+zAmp*Math.sin(Math.PI*k);
    if(diff==='high'&&scene==='bridge')z-=7*Math.sin(Math.PI*k);                         /* 桥下净空穿越 */
    z+=(kind==='rrt'?1.4*Math.sin(k*Math.PI*5+.7):0);
    out.push(lanePoint(k,side*dir,clamp(z,6,30)));
  }
  out[0]={...CFG.start};out[n]={...CFG.end};
  return out;
}
function pathSegments(path){const out=[];for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];out.push({a:a,b:b,len:dist3(a,b)});}return out;}
function pathSamples(path,n){
  const segs=pathSegments(path),total=segs.reduce((a,s)=>a+s.len,0)||1,out=[];
  for(let i=0;i<=n;i++){
    const target=total*i/n;let acc=0,picked=segs[segs.length-1].b;
    for(let j=0;j<segs.length;j++){
      const s=segs[j];
      if(acc+s.len>=target||j===segs.length-1){picked=lerp3(s.a,s.b,s.len?clamp((target-acc)/s.len,0,1):0);break;}
      acc+=s.len;
    }
    out.push(picked);
  }
  return out;
}
const pathLength=p=>pathSegments(p).reduce((a,s)=>a+s.len,0);
function pointAt(path,f){
  const segs=pathSegments(path),total=segs.reduce((a,s)=>a+s.len,0)||1,target=total*clamp(f,0,1);let acc=0;
  for(const s of segs){if(acc+s.len>=target)return lerp3(s.a,s.b,s.len?(target-acc)/s.len:0);acc+=s.len;}
  return {...path[path.length-1]};
}
function maxSegAngles(path){
  let mh=0,mv=0;
  for(let i=0;i<path.length-1;i++){
    const a=path[i],b=path[i+1],hl=Math.hypot(b.x-a.x,b.y-a.y)||1e-6;
    mv=Math.max(mv,Math.abs(Math.atan2((b.z||0)-(a.z||0),hl))*180/Math.PI);
  }
  for(let i=1;i<path.length-1;i++){
    const a=path[i-1],b=path[i],c=path[i+1];
    const v1={x:b.x-a.x,y:b.y-a.y},v2={x:c.x-b.x,y:c.y-b.y};
    const l1=Math.hypot(v1.x,v1.y)||1e-6,l2=Math.hypot(v2.x,v2.y)||1e-6;
    mh=Math.max(mh,Math.acos(clamp((v1.x*v2.x+v1.y*v2.y)/(l1*l2),-1,1))*180/Math.PI);
  }
  return {thH:mh,thV:mv};
}

/* ---------- 5. 仿真与评分 ---------- */
function distToBox(p,s){return Math.hypot(Math.max(s.x0-p.x,0,p.x-s.x1),Math.max(s.y0-p.y,0,p.y-s.y1),Math.max(s.z0-p.z,0,p.z-s.z1));}
function hitKind(p,g){
  if(p.z>g.ceiling+.2)return 'limit';
  if(p.z<g.minSafe-.2)return 'clear';
  for(const s of g.solids)
    if(p.x>s.x0-.3&&p.x<s.x1+.3&&p.y>s.y0-.3&&p.y<s.y1+.3&&p.z>s.z0-.3&&p.z<s.z1+.3)return 'solid';
  for(const c of g.cables)if(distSeg3(p,c.a,c.b)<1.2)return 'cable';
  return null;
}
function simulate(path){
  const g=S.geo,pts=pathSamples(path,110),ang=maxSegAngles(path);
  let T=0,E=100,col=0,D=999,prevHit=false,fail=null,climb=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],h=hitKind(p,g),solid=(h==='solid'||h==='cable');
    if(solid&&!prevHit)col++;
    prevHit=solid;
    if(!fail){
      if(h==='limit')fail='超限高';
      else if(h==='clear')fail='低于净空';
      else if(solid)fail='碰撞';
      else if(ang.thH>90)fail='水平角超限';
      else if(ang.thV>45)fail='垂直角超限';
    }
    for(const s of g.solids)D=Math.min(D,distToBox(p,s));
    for(const c of g.cables)D=Math.min(D,distSeg3(p,c.a,c.b));
    if(i>0){
      const q=pts[i-1],seg=dist3(p,q),dz=(p.z||0)-(q.z||0),dt=seg/CFG.speed;
      T+=dt;
      let mode=.74;
      if(dz>.18){mode=2.2;climb+=dz;}else if(dz<-.18)mode=.6;
      E-=mode*dt;
    }
  }
  T+=climb*.06;E=clamp(E,0,100);
  const lim=DIFFS[S.diff].limit;
  if(!fail&&lim&&T>lim)fail='超时';
  return {T:T,E:E,D:+D.toFixed(2),thH:+ang.thH.toFixed(1),thV:+ang.thV.toFixed(1),col:col,fail:fail};
}
/* 权重滑块彼此独立；分母只用于计算得分，不回写滑块、不做归一化 */
function grading(m){
  const w=S.weights,k=CFG.score,denom=Math.max(1,w.T+w.E+w.S);
  const ST=clamp(100-k.kT*Math.max(0,m.T-k.T0),0,100);
  const SE=clamp(100-k.kE*Math.max(0,k.E0-m.E),0,100);
  const SS=clamp(100-k.kSafe*Math.max(0,k.D0-m.D)-15*m.col,0,100);
  const dTh=.5*Math.max(0,m.thH-60)+.5*Math.max(0,m.thV-30),dD=k.kD*Math.max(0,k.D0-m.D);
  const G=clamp((w.T*ST+w.E*SE+w.S*SS)/denom-dTh-dD,0,100);
  const grade=G>=85?'A':G>=70?'B':G>=55?'C':'D';
  return {ST:ST,SE:SE,SS:SS,STh:clamp(100-dTh,0,100),SD:clamp(100-k.kSafe*Math.max(0,k.D0-m.D),0,100),
          dTh:dTh,dD:dD,G:+G.toFixed(2),grade:grade};
}
const RADAR_DIMS=['时效','能耗','安全','平顺','间距'];
function radarValues(m){const g=grading(m);return [g.ST,g.SE,g.SS,g.STh,g.SD];}

/* ---------- 6. 三维渲染 ---------- */
function setupCanvas(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||600,h=cv.clientHeight||300;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  return {c:c,W:w,H:h};
}
function camBasis(){
  const cy=Math.cos(S.cam.yaw),sy=Math.sin(S.cam.yaw),cp=Math.cos(S.cam.pitch),sp=Math.sin(S.cam.pitch),t=S.cam.target;
  const eye={x:t.x+S.cam.dist*cy*cp,y:t.y+S.cam.dist*sy*cp,z:t.z+S.cam.dist*sp};
  const f=norm(sub(t,eye)),r=norm(cross(f,{x:0,y:0,z:1})),u=cross(r,f);
  return {eye:eye,f:f,r:r,u:u};
}
function project(p,W,H,B){
  const d=sub({x:p.x,y:p.y,z:p.z||0},B.eye),cz=dot(d,B.f);if(cz<=1)return null;
  const s=Math.min(W,H)*1.70/cz;
  return {x:W/2+dot(d,B.r)*s+S.cam.panX,y:H/2-dot(d,B.u)*s+S.cam.panY,s:s,depth:cz};
}
function poly(c,pts,fill,stroke,lw){
  if(!pts||pts.some(p=>!p))return;
  c.beginPath();c.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke();}
}
function line3(c,a,b,W,H,B,color,lw,dash){
  const p=project(a,W,H,B),q=project(b,W,H,B);if(!p||!q)return;
  c.save();c.beginPath();if(dash&&dash.length)c.setLineDash(dash);
  c.strokeStyle=color;c.lineWidth=lw||1;c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();c.restore();
}
/* ---------- 统一深度队列 ----------
   所有实体面、装饰线、烟点、航标环、斜拉索、窗带、限高面一律入队，
   按相机空间深度从远到近绘制；长线自动切段，避免整条线用一个深度造成前后遮挡错误。 */
function iPoly(items,pts,fill,stroke,lw,W,H,B){
  const pp=pts.map(p=>project(p,W,H,B));if(pp.some(p=>!p))return;
  items.push({d:pp.reduce((a,p)=>a+p.depth,0)/pp.length,t:0,pts:pp,fill:fill,stroke:stroke,lw:lw});
}
function iLine(items,a,b,color,lw,dash,W,H,B){
  const len=dist3(a,b),n=Math.min(8,Math.max(1,Math.ceil(len/7)));
  for(let i=0;i<n;i++){
    const p=project(lerp3(a,b,i/n),W,H,B),q=project(lerp3(a,b,(i+1)/n),W,H,B);
    if(!p||!q)continue;
    items.push({d:(p.depth+q.depth)/2,t:1,a:p,b:q,color:color,lw:lw,dash:dash||[]});
  }
}
function iDot(items,p,r,color,W,H,B){
  const q=project(p,W,H,B);if(!q)return;
  items.push({d:q.depth,t:2,a:q,r:Math.max(1.5,r*q.s/40),color:color});
}
function flushItems(items,c){
  items.sort((a,b)=>b.d-a.d);
  for(const it of items){
    if(it.t===0)poly(c,it.pts,it.fill,it.stroke,it.lw);
    else if(it.t===1){
      c.save();c.beginPath();if(it.dash&&it.dash.length)c.setLineDash(it.dash);
      c.strokeStyle=it.color;c.lineWidth=it.lw;c.moveTo(it.a.x,it.a.y);c.lineTo(it.b.x,it.b.y);
      c.stroke();c.restore();
    }else{
      c.beginPath();c.arc(it.a.x,it.a.y,it.r,0,Math.PI*2);c.fillStyle=it.color;c.fill();
    }
  }
}
function pushBox(items,b,W,H,B){
  const A=[{x:b.x0,y:b.y0,z:b.z0},{x:b.x1,y:b.y0,z:b.z0},{x:b.x1,y:b.y1,z:b.z0},{x:b.x0,y:b.y1,z:b.z0},
           {x:b.x0,y:b.y0,z:b.z1},{x:b.x1,y:b.y0,z:b.z1},{x:b.x1,y:b.y1,z:b.z1},{x:b.x0,y:b.y1,z:b.z1}];
  const defs=[[4,5,6,7,1.06],[0,1,5,4,.72],[1,2,6,5,.82],[2,3,7,6,.66],[3,0,4,7,.90]];
  for(const d of defs)
    iPoly(items,d.slice(0,4).map(i=>A[i]),shade(b.color,d[4]),'rgba(255,255,255,.32)',.6,W,H,B);
}
function pushCyl(items,cy,W,H,B){
  const N=12,top=[],bot=[],rt=cy.rTop||cy.r;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    bot.push({x:cy.x+Math.cos(a)*cy.r,y:cy.y+Math.sin(a)*cy.r,z:cy.z0});
    top.push({x:cy.x+Math.cos(a)*rt,y:cy.y+Math.sin(a)*rt,z:cy.z1});
  }
  for(let i=0;i<N;i++){
    const j=(i+1)%N;
    iPoly(items,[bot[i],bot[j],top[j],top[i]],
      shade(cy.color,.66+.28*Math.abs(Math.cos(i/N*Math.PI*2))),'rgba(255,255,255,.28)',.5,W,H,B);
  }
  if(cy.dome>0){
    const apex={x:cy.x,y:cy.y,z:cy.z1+cy.dome};
    for(let i=0;i<N;i++)iPoly(items,[top[i],top[(i+1)%N],apex],
      shade(cy.color,1.02+.06*Math.abs(Math.cos(i/N*Math.PI*2))),'rgba(255,255,255,.3)',.5,W,H,B);
  }else iPoly(items,top,shade(cy.color,1.12),'rgba(255,255,255,.4)',.6,W,H,B);
  /* 红白航标环（烟囱/塔） */
  if(cy.ring>0){
    const zz=cy.z1-cy.ring,r=(cy.rTop||cy.r)*1.06;
    for(let i=0;i<N;i++){
      const a0=i/N*Math.PI*2,a1=(i+1)/N*Math.PI*2;
      iLine(items,{x:cy.x+Math.cos(a0)*r,y:cy.y+Math.sin(a0)*r,z:zz},
                  {x:cy.x+Math.cos(a1)*r,y:cy.y+Math.sin(a1)*r,z:zz},'#B23B3B',1.8,null,W,H,B);
    }
  }
}
function pushWedge(items,w,W,H,B){
  const x0=w.x0,x1=w.x1,y0=w.y0,y1=w.y1,ym=(y0+y1)/2,z0=w.z0,z1=w.z1;
  const A={x:x0,y:y0,z:z0},Bp={x:x1,y:y0,z:z0},C={x:x1,y:y1,z:z0},D={x:x0,y:y1,z:z0};
  const E={x:x0,y:ym,z:z1},F={x:x1,y:ym,z:z1};
  const st='rgba(255,255,255,.30)';
  iPoly(items,[A,Bp,F,E],shade(w.color,.92),st,.6,W,H,B);        /* 南坡 */
  iPoly(items,[E,F,C,D],shade(w.color,1.08),st,.6,W,H,B);        /* 北坡 */
  iPoly(items,[A,E,D],shade(w.color,.80),st,.6,W,H,B);           /* 西山墙 */
  iPoly(items,[Bp,C,F],shade(w.color,.86),st,.6,W,H,B);          /* 东山墙 */
}
function pushNoFly(items,n,W,H,B){
  const C=[
    {x:n.x0,y:n.y0,z:n.z0},{x:n.x1,y:n.y0,z:n.z0},{x:n.x1,y:n.y1,z:n.z0},{x:n.x0,y:n.y1,z:n.z0},
    {x:n.x0,y:n.y0,z:n.z1},{x:n.x1,y:n.y0,z:n.z1},{x:n.x1,y:n.y1,z:n.z1},{x:n.x0,y:n.y1,z:n.z1}];
  const side='rgba(163,45,45,.055)',edge='rgba(163,45,45,.62)';
  /* 空域柱：半透明四个侧面 + 稍深的顶面，不画实心块 */
  iPoly(items,[C[0],C[1],C[5],C[4]],side,null,0,W,H,B);
  iPoly(items,[C[1],C[2],C[6],C[5]],side,null,0,W,H,B);
  iPoly(items,[C[2],C[3],C[7],C[6]],side,null,0,W,H,B);
  iPoly(items,[C[3],C[0],C[4],C[7]],side,null,0,W,H,B);
  iPoly(items,[C[4],C[5],C[6],C[7]],'rgba(163,45,45,.13)',edge,1.1,W,H,B);
  for(let i=0;i<4;i++){
    iLine(items,C[i],C[i+4],edge,1,[4,3],W,H,B);
    iLine(items,C[i],C[(i+1)%4],edge,.9,[4,3],W,H,B);
  }
}
function draw3D(cv){
  const {c,W,H}=setupCanvas(cv),g=S.geo,B=camBasis();
  c.fillStyle='#FBFCFE';c.fillRect(0,0,W,H);                         /* 与 index.html / 2D 一致的浅底 */
  const items=[];
  /* --- 背景层：地面 / 网格 / 道路 / 水面 / 落地阴影（z≈0，恒在最底） --- */
  poly(c,[{x:0,y:0,z:0},{x:100,y:0,z:0},{x:100,y:60,z:0},{x:0,y:60,z:0}].map(p=>project(p,W,H,B)),
       CFG.colors.ground,'#C9D4E0',1);
  for(let x=0;x<=100;x+=10)line3(c,{x:x,y:0,z:.01},{x:x,y:60,z:.01},W,H,B,CFG.colors.grid,.7);
  for(let y=0;y<=60;y+=10)line3(c,{x:0,y:y,z:.01},{x:100,y:y,z:.01},W,H,B,CFG.colors.grid,.7);
  for(const r of g.roads)
    poly(c,[{x:r.x0,y:r.y0,z:.02},{x:r.x1,y:r.y0,z:.02},{x:r.x1,y:r.y1,z:.02},{x:r.x0,y:r.y1,z:.02}]
      .map(p=>project(p,W,H,B)),r.color,null);
  for(const b of g.blocks)if(b.z0===0&&b.z1-b.z0>2)
    poly(c,[{x:b.x0+2,y:b.y0-2.6,z:.025},{x:b.x1+2,y:b.y0-2.6,z:.025},
            {x:b.x1+2,y:b.y1-2.6,z:.025},{x:b.x0+2,y:b.y1-2.6,z:.025}].map(p=>project(p,W,H,B)),
         'rgba(27,39,51,.085)',null);
  if(g.water){
    const w=g.water;
    poly(c,[{x:w.x0,y:w.y0,z:.035},{x:w.x1,y:w.y0,z:.035},{x:w.x1,y:w.y1,z:.035},{x:w.x0,y:w.y1,z:.035}]
      .map(p=>project(p,W,H,B)),CFG.colors.water,'#7FB0D8',1);
    for(let yy=3;yy<60;yy+=5)for(let xx=w.x0+2;xx<w.x1-2;xx+=7)
      line3(c,{x:xx,y:yy,z:.055},{x:Math.min(xx+3.4,w.x1-1),y:yy,z:.055},W,H,B,'rgba(255,255,255,.42)',1);
  }
  /* --- 实体层：全部入队 --- */
  for(const b of g.blocks)pushBox(items,b,W,H,B);
  for(const b of g.roofs)pushBox(items,b,W,H,B);
  for(const w of g.wedges)pushWedge(items,w,W,H,B);
  for(const cy of g.cyls)pushCyl(items,cy,W,H,B);
  for(const n of g.noFly)pushNoFly(items,n,W,H,B);
  for(const l of g.lines)iLine(items,l.a,l.b,l.color,l.lw,l.dash,W,H,B);
  for(const d of g.dots)iDot(items,d,d.r,'rgba(150,165,180,.32)',W,H,B);
  iLine(items,{x:0,y:0,z:CFG.ceiling},{x:100,y:0,z:CFG.ceiling},'rgba(163,45,45,.45)',1,[5,5],W,H,B);
  flushItems(items,c);
  S.renderStat={total:items.length,polys:items.filter(i=>i.t===0).length,lines:items.filter(i=>i.t===1).length};
  drawPaths3D(c,W,H,B);drawLegend(c,W);
}

function drawPaths3D(c,W,H,B){
  for(const L of pathLayers()){
    const pp=L.path.map(p=>project(p,W,H,B));
    c.save();c.beginPath();if(L.dash.length)c.setLineDash(L.dash);
    c.strokeStyle=L.color;c.lineWidth=L.lw;
    let started=false;
    for(const p of pp){if(!p){started=false;continue;}if(!started){c.moveTo(p.x,p.y);started=true;}else c.lineTo(p.x,p.y);}
    c.stroke();c.restore();
  }
  S.path.forEach((p,i)=>{
    const q=project(p,W,H,B);if(!q)return;
    c.beginPath();c.arc(q.x,q.y,i===0||i===S.path.length-1?5:4.5,0,Math.PI*2);
    c.fillStyle=p.locked?CFG.colors.path:'#fff';c.fill();c.strokeStyle=CFG.colors.path;c.lineWidth=2;c.stroke();
  });
  mark(c,project(CFG.start,W,H,B),'起');mark(c,project(CFG.end,W,H,B),'终');
  if(S.play.active){const q=project(pointAt(S.path,S.play.t/(S.play.dur||1)),W,H,B);
    if(q){c.beginPath();c.arc(q.x,q.y,6,0,Math.PI*2);c.fillStyle=CFG.colors.plane;c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();}}
}
function mark(c,p,t){if(!p)return;c.font='11px sans-serif';c.fillStyle='#334';c.fillText(t,p.x+8,p.y-8);}
function drawLegend(c,W){
  const list=pathLayers().filter(L=>L.tag);if(!list.length)return;
  let x=W-108,y=10;c.font='11px sans-serif';
  for(const L of list){c.fillStyle=L.color;c.fillRect(x,y+2,10,10);c.fillStyle='#334';c.fillText(L.tag,x+15,y+11);y+=16;}
}
function p2(p,W,H){const k=Math.min(W/110,H/70)*S.zoom2d;return {x:W/2+(p.x-50)*k+S.pan2d.x,y:H/2-(p.y-30)*k+S.pan2d.y};}
function draw2D(cv){
  const {c,W,H}=setupCanvas(cv),g=S.geo;
  c.fillStyle='#FAFCFE';c.fillRect(0,0,W,H);
  c.strokeStyle=CFG.colors.grid;c.lineWidth=.7;
  for(let x=0;x<=100;x+=10){const a=p2({x:x,y:0},W,H),b=p2({x:x,y:60},W,H);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
  for(let y=0;y<=60;y+=10){const a=p2({x:0,y:y},W,H),b=p2({x:100,y:y},W,H);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
  for(const r of g.roads){const a=p2({x:r.x0,y:r.y0},W,H),b=p2({x:r.x1,y:r.y1},W,H);c.fillStyle=r.color;c.fillRect(a.x,b.y,b.x-a.x,a.y-b.y);}
  if(g.water){const a=p2({x:g.water.x0,y:g.water.y0},W,H),b=p2({x:g.water.x1,y:g.water.y1},W,H);c.fillStyle=CFG.colors.water;c.fillRect(a.x,b.y,b.x-a.x,a.y-b.y);}
  for(const s of g.solids){
    const a=p2({x:s.x0,y:s.y0},W,H),b=p2({x:s.x1,y:s.y1},W,H);
    c.fillStyle=s.z0>0?'rgba(120,140,160,.22)':'rgba(120,140,160,.55)';c.fillRect(a.x,b.y,b.x-a.x,a.y-b.y);
    c.strokeStyle='rgba(60,80,100,.6)';c.lineWidth=1;c.strokeRect(a.x,b.y,b.x-a.x,a.y-b.y);
  }
  for(const n of g.noFly){
    const a=p2({x:n.x0,y:n.y0},W,H),b=p2({x:n.x1,y:n.y1},W,H);
    c.fillStyle='rgba(163,45,45,.16)';c.fillRect(a.x,b.y,b.x-a.x,a.y-b.y);
    c.strokeStyle='#A32D2D';c.setLineDash([4,3]);c.strokeRect(a.x,b.y,b.x-a.x,a.y-b.y);c.setLineDash([]);
  }
  for(const cb of g.cables){const a=p2(cb.a,W,H),b=p2(cb.b,W,H);c.strokeStyle='#6B7B8C';c.lineWidth=1.5;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
  for(const L of pathLayers()){
    c.save();c.beginPath();if(L.dash.length)c.setLineDash(L.dash);c.strokeStyle=L.color;c.lineWidth=L.lw;
    L.path.forEach((p,i)=>{const q=p2(p,W,H);if(i===0)c.moveTo(q.x,q.y);else c.lineTo(q.x,q.y);});c.stroke();c.restore();
  }
  S.path.forEach((p,i)=>{const q=p2(p,W,H);c.beginPath();c.arc(q.x,q.y,i===0||i===S.path.length-1?5:4.5,0,Math.PI*2);
    c.fillStyle=p.locked?CFG.colors.path:'#fff';c.fill();c.strokeStyle=CFG.colors.path;c.lineWidth=2;c.stroke();});
  mark(c,p2(CFG.start,W,H),'起');mark(c,p2(CFG.end,W,H),'终');
  if(S.play.active){const q=p2(pointAt(S.path,S.play.t/(S.play.dur||1)),W,H);c.beginPath();c.arc(q.x,q.y,6,0,Math.PI*2);c.fillStyle=CFG.colors.plane;c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();}
  drawLegend(c,W);
}
function pathLayers(){
  const out=[];
  if(S.sample&&S.samples[S.sample])out.push({path:S.samples[S.sample],color:CFG.colors.sample,lw:2,dash:[6,4],tag:null});
  const keys=S.compare?['astar','rrt','dijkstra']:(S.algo?[S.algo]:[]),names={astar:'A*',rrt:'RRT*',dijkstra:'Dijkstra'};
  for(const k of keys)if(S.algoPaths[k])out.push({path:S.algoPaths[k],color:CFG.colors[k],lw:2.2,dash:k==='rrt'?[]:[7,4],tag:names[k]});
  out.push({path:S.path,color:CFG.colors.path,lw:3,dash:[],tag:null});
  return out;
}
function drawScene(){if(S.mode==='3d')draw3D($('sceneCv'));else draw2D($('sceneCv'));}

/* ---------- 高度剖面：只有刻度数字与高度参考线 ---------- */
function profileGeom(cv){const W=cv.clientWidth||600,H=cv.clientHeight||146;
  return {W:W,H:H,L:34,R:W-10,T:10,B:H-20,X:s=>34+(W-44)*clamp(s,0,1),Y:z=>(H-20)-(H-30)*clamp(z/40,0,1)};}
function drawProfile(cv){
  const {c,W,H}=setupCanvas(cv),q=profileGeom(cv),g=S.geo;
  c.fillStyle='#FBFCFE';c.fillRect(0,0,W,H);
  c.font='10px sans-serif';c.fillStyle='#8794A3';
  for(let z=0;z<=40;z+=10){const y=q.Y(z);c.strokeStyle='#E8EDF3';c.lineWidth=1;c.beginPath();c.moveTo(q.L,y);c.lineTo(q.R,y);c.stroke();c.fillText(String(z),8,y+3);}
  for(let s=0;s<=1.0001;s+=.25){const x=q.X(s);c.strokeStyle='#EEF2F6';c.beginPath();c.moveTo(x,q.T);c.lineTo(x,q.B);c.stroke();c.fillText(String(Math.round(s*100)),x-6,H-6);}
  const refs=[{z:CFG.ceiling,color:'#A32D2D'},{z:g.minSafe,color:'#0F6E56'},{z:12,color:'#B8C2CC'}];
  if(g.bridge)refs.push({z:g.bridge.zDeck,color:'#8FA2B5'},{z:g.bridge.zDeckTop,color:'#8FA2B5'});
  for(const r of refs){c.save();c.setLineDash([5,4]);c.strokeStyle=r.color;c.lineWidth=1.2;c.beginPath();c.moveTo(q.L,q.Y(r.z));c.lineTo(q.R,q.Y(r.z));c.stroke();c.restore();}
  const curve=(path,color,dash,lw)=>{
    c.save();c.beginPath();if(dash.length)c.setLineDash(dash);c.strokeStyle=color;c.lineWidth=lw;
    const segs=pathSegments(path),total=segs.reduce((a,s)=>a+s.len,0)||1;let acc=0;
    c.moveTo(q.X(0),q.Y(path[0].z||0));
    for(const s of segs){acc+=s.len;c.lineTo(q.X(acc/total),q.Y(s.b.z||0));}c.stroke();c.restore();
  };
  for(const L of pathLayers())if(L.tag)curve(L.path,L.color,[6,3],1.6);
  curve(S.path,CFG.colors.path,[],2.4);
  const segs=pathSegments(S.path),total=segs.reduce((a,s)=>a+s.len,0)||1;let acc=0;
  S.path.forEach((p,i)=>{
    if(i>0)acc+=segs[i-1].len;
    const x=q.X(acc/total),y=q.Y(p.z||0);
    c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fillStyle=p.locked?CFG.colors.path:'#fff';c.fill();c.strokeStyle=CFG.colors.path;c.lineWidth=2;c.stroke();
  });
}
/* ---------- 雷达图 ---------- */
function drawRadar(cv){
  const {c,W,H}=setupCanvas(cv),cx=W/2,cy=H/2+2,R=Math.min(W,H)*.34,N=5;
  c.fillStyle='#FBFCFE';c.fillRect(0,0,W,H);
  const ang=i=>-Math.PI/2+i*2*Math.PI/N,pt=(i,v)=>({x:cx+Math.cos(ang(i))*R*clamp(v,0,100)/100,y:cy+Math.sin(ang(i))*R*clamp(v,0,100)/100});
  for(let lv=1;lv<=4;lv++)poly(c,Array.from({length:N},(_,i)=>pt(i,lv*25)),null,'#E2E8F0',1);
  for(let i=0;i<N;i++){const p=pt(i,100);c.strokeStyle='#E2E8F0';c.beginPath();c.moveTo(cx,cy);c.lineTo(p.x,p.y);c.stroke();}
  const draw=(vals,color,fill)=>{const p=vals.map((v,i)=>pt(i,v));poly(c,p,fill,color,2);p.forEach(q=>{c.beginPath();c.arc(q.x,q.y,2.5,0,Math.PI*2);c.fillStyle=color;c.fill();});};
  if(S.est)draw(radarValues(S.est),'#7B8CA0','rgba(123,140,160,.18)');
  if(S.real)draw(radarValues(S.real),'#0F6E56','rgba(15,110,86,.20)');
  c.font='10px sans-serif';c.fillStyle='#5A6B7C';c.textAlign='center';
  RADAR_DIMS.forEach((t,i)=>{const p=pt(i,122);c.fillText(t,p.x,p.y+3);});c.textAlign='left';
}

function showTheory(){
  const html=

    '<li>代价函数 <code>J = Σ wᵢ·ĉᵢ</code>：先把各代价无量纲化，再按权重合成；权重变了，最优航线跟着变。</li></ul>'+
    '<h4>② 通常要考虑哪些因素</h4>'+
    '<ul>'+
    '<li><b>几何与障碍</b>：建筑、桥体、桥墩、线缆、信号塔、禁飞区 —— 碰撞即失败，不进权重。</li>'+

    '<li><b>动力学约束</b>：水平转弯角 θh、垂直爬升角 θv、爬升／下降率、最小转弯半径。</li>'+
    '<li><b>代价项</b>：航程／飞行时间、电量消耗（平飞·爬升·下降·悬停四档）、与障碍的最小三维间距。</li>'+

    '</ul>'+
    '<h4>③ 三种算法简介</h4>'+
    '<ul>'+
    '<li><b>A*</b>：栅格／图搜索 + 启发式函数 <code>f = g + h</code>，用「到终点的估计距离」引导扩展，搜索快，路径短直且带明显折线感。地图已知时最常用。</li>'+
    '<li><b>Dijkstra</b>：无启发式的广度扩散，按累计代价逐层扩展到全图，保证最小代价但扩展节点多；本关模拟为<b>最保守、远离障碍、航程最长</b>的解。</li>'+
    '<li><b>RRT*</b>：随机采样构建快速扩展树，并在重连中渐进优化，适合高维连续空间与复杂约束；路径<b>平滑、带扰动</b>，每次结果略有差异。</li>'+
    '</ul>'+
    '<h4>④ 对比</h4>'+
    '<table class="theory"><tr><th>维度</th><th>A*</th><th>Dijkstra</th><th>RRT*</th></tr>'+
    '<tr><td>搜索方式</td><td>启发式图搜索</td><td>无启发式全图扩散</td><td>随机采样树 + 渐进优化</td></tr>'+
    '<tr><td>路径形状</td><td>短直折线</td><td>大幅绕行</td><td>平滑曲线带扰动</td></tr>'+
    '<tr><td>航程</td><td>最短</td><td>最长</td><td>居中</td></tr>'+

/* ---------- 8. 交互 ---------- */
function canvasHit(cv,cx,cy,kind){
  const r=cv.getBoundingClientRect(),sx=cx-r.left,sy=cy-r.top,W=cv.clientWidth,H=cv.clientHeight;
  let best=null,bd=14;
  const segs=pathSegments(S.path),total=segs.reduce((a,s)=>a+s.len,0)||1;let acc=0;
  S.path.forEach((p,i)=>{
    if(i>0)acc+=segs[i-1].len;
    if(i===0||i===S.path.length-1)return;
    let q;
    if(kind==='profile'){const g=profileGeom(cv);q={x:g.X(acc/total),y:g.Y(p.z||0)};}
    else if(S.mode==='3d')q=project(p,W,H,camBasis());
    else q=p2(p,W,H);
    if(!q)return;
    const d=Math.hypot(q.x-sx,q.y-sy);
    if(d<bd){bd=d;best={idx:i};}
  });
  return best?{idx:best.idx,kind:kind}:null;
}
function bindCanvas(cv,kind){
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    if(!$('mask').classList.contains('hidden'))return;
    const hit=canvasHit(cv,e.clientX,e.clientY,kind);
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    if(hit&&e.button===0)S.drag={type:'wp',idx:hit.idx,kind:kind,x:e.clientX,y:e.clientY};
    else if(kind==='scene'&&S.mode==='3d')S.drag={type:e.button===2?'pan':'rot',x:e.clientX,y:e.clientY};
    else if(kind==='scene'&&S.mode==='2d')S.drag={type:e.button===2?'pan2':'none',x:e.clientX,y:e.clientY};
    else S.drag=null;
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    const d=S.drag;if(!d)return;
    const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(d.type==='wp'){
      const p=S.path[d.idx];
      if(d.kind==='profile'){
        const q=profileGeom(cv);p.z=clamp(p.z+(-dy)*40/(q.B-q.T),S.geo.minSafe+1,CFG.ceiling-1);
      }else if(S.mode==='3d'){
        const B=camBasis(),k=S.cam.dist/700;
        p.x=clamp(p.x+(dx*B.r.x-dy*B.u.x)*k,2,98);p.y=clamp(p.y+(dx*B.r.y-dy*B.u.y)*k,2,58);
      }else{
        const k=Math.min(cv.clientWidth/110,cv.clientHeight/70)*S.zoom2d;
        p.x=clamp(p.x+dx/k,2,98);p.y=clamp(p.y-dy/k,2,58);
      }
      p.locked=true;d.x=e.clientX;d.y=e.clientY;recalc();
    }else if(d.type==='rot'){
      S.cam.yaw+=dx*.006;S.cam.pitch=clamp(S.cam.pitch-dy*.005,.12,1.35);d.x=e.clientX;d.y=e.clientY;drawScene();
    }else if(d.type==='pan'){S.cam.panX+=dx;S.cam.panY+=dy;d.x=e.clientX;d.y=e.clientY;drawScene();}
    else if(d.type==='pan2'){S.pan2d.x+=dx;S.pan2d.y+=dy;d.x=e.clientX;d.y=e.clientY;drawScene();}
  });
  const end=()=>{S.drag=null;};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('dblclick',e=>{const h=canvasHit(cv,e.clientX,e.clientY,kind);if(h){S.path[h.idx].locked=false;recalc();}});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    if(kind==='scene'&&S.mode==='3d')S.cam.dist=clamp(S.cam.dist*Math.exp(e.deltaY*.0011),70,340);
    else if(kind==='scene')S.zoom2d=clamp(S.zoom2d*Math.exp(-e.deltaY*.0011),.5,2.6);
    drawScene();
  },{passive:false});
}

/* ---------- 9. 回放 / 音效 / 结算 ---------- */
function tone(ac,f,t,dur,vol,type){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function playSuccess(){
  S.soundPlayed=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC){S.soundErr='no AudioContext';return;}
    const ac=new AC();if(ac.resume)ac.resume();
    const t=ac.currentTime+.02;
    [523.25,659.25,783.99,1046.50,1318.51].forEach((f,i)=>{
      tone(ac,f,t+i*.095,.42,.10,'sine');tone(ac,f*2,t+i*.095,.24,.028,'triangle');
    });
    tone(ac,261.63,t,.95,.045,'sine');
  }catch(err){S.soundErr=err.message;}
}
function playFail(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=new AC();if(ac.resume)ac.resume();const t=ac.currentTime+.02;
    tone(ac,196,t,.30,.085,'triangle');tone(ac,146.83,t+.16,.45,.085,'triangle');
  }catch(_){}
}
function spawnFx(ok){
  const layer=$('fxLayer');layer.innerHTML='';layer.className='';
  if(!ok){layer.className='pulse';return;}
  const cols=['#0F6E56','#185FA5','#BA7517','#A32D2D','#7C3AED','#2E8B6F'];
  for(let i=0;i<30;i++){
    const e=document.createElement('i');
    e.style.left=(Math.random()*100)+'%';e.style.top=(-8-Math.random()*36)+'px';

    layer.appendChild(e);
  }
}

function loop(ts){
  /* dt 双侧夹紧：切回标签页 / 时间回拨时不允许计时倒退 */
  const dt=Math.max(0,Math.min(.06,(ts-lastTs)/1000||0));lastTs=ts;
  if(S.play.active&&!S.play.paused){
    S.play.t+=dt*S.play.speed;
    if(S.play.t>=S.play.dur){S.play.t=S.play.dur;finishFlight();}
  }
  if(S.play.active){
    $('seek').value=Math.round(clamp(S.play.t/(S.play.dur||1),0,1)*1000);
    $('playTime').textContent=fmt(S.play.t,1)+' / '+fmt(S.play.dur,1)+' s';
  }
  syncHUD();drawScene();
  requestAnimationFrame(loop);
}

              {x:92,y:20,z:13},{x:92,y:40,z:15},{...CFG.end}];
      recalc();
    }
    startFlight();finishFlight();
  }
}
